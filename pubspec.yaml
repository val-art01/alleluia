name: alleluia_tome_1
description: "Application de chants religieux — Culte d'enfants de EEC"

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI et icônes
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.6
  font_awesome_flutter: ^10.9.1
  google_fonts: ^6.3.2

  # State management 
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^17.0.0

  # Gestion du splash screen
  flutter_native_splash: ^2.4.7
  
  # Audio
  audioplayers: ^6.5.1

  # Base de données locale Isar
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Accès aux chemins du stockage local
  path_provider: ^2.1.5
  diacritic: ^0.1.6
  # custom_lint: ^0.5.11
  # riverpod_lint: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Génération automatique du code pour Isar
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  analyzer: ^5.13.0
  riverpod_generator: ^2.3.3
  custom_lint: ^0.6.4

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/data/chants_alleluia.json
    - assets/sound/

flutter_native_splash:
  # Fond blanc pur (mode clair)
  color: "#7ABAEE"
  # Logo centré
  image: assets/images/logo_eec.png
  # Mode sombre
  color_dark: "#7ABAEE"
  image_dark: assets/images/logo_eec.png
  # Plein écran
  fullscreen: true
  # Android 12+ : cercle blanc derrière le logo
  android_12:
    image: assets/images/logo_eec.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/logo_eec.png
    icon_background_color_dark: "#FFFFFF"
  web: false


